<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 CLASSIFIED DOSSIER • ₹1199</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #050505; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .vault-container {
            max-width: 1300px; width: 100%; background: #111; border: 1px solid #2a2a2a;
            border-radius: 32px; padding: 35px; box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            position: relative; overflow: hidden;
        }
        .vault-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 6px);
            pointer-events: none; z-index: 5;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
            flex-wrap: wrap; gap: 15px; border-bottom: 1px solid #222; padding-bottom: 20px;
        }
        .logo-area { display: flex; align-items: center; gap: 14px; }
        .lock-icon { background: #e50914; color: #fff; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .logo-text h1 { color: #f5f5f5; font-size: 22px; font-weight: 700; }
        .logo-text span { color: #777; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
        .status-badge { background: #1a1a1a; padding: 8px 20px; border-radius: 100px; border: 1px solid #333; color: #aaa; font-size: 13px; }

        .paywall-banner {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a); border: 1px solid #2c2c2c;
            border-radius: 20px; padding: 20px 30px; margin-bottom: 35px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        .paywall-text { display: flex; align-items: center; gap: 15px; }
        .paywall-text i { font-size: 28px; color: #f5c518; }
        .paywall-text h2 { color: #eee; font-size: 18px; }
        .paywall-text p { color: #888; font-size: 14px; }
        .pay-btn {
            background: #f5c518; color: #0a0a0a; border: none; padding: 14px 40px;
            border-radius: 60px; font-weight: 800; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(245, 197, 24, 0.3);
            transition: 0.2s;
        }
        .pay-btn:hover { transform: scale(1.03); background: #ffe066; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 25px; margin-bottom: 30px; }

        .member-card {
            background: #0d0d0d; border-radius: 18px; overflow: hidden; border: 1px solid #222;
            transition: 0.3s; position: relative; cursor: pointer;
        }
        .member-card:hover { transform: translateY(-6px); border-color: #444; box-shadow: 0 12px 30px rgba(0,0,0,0.8); }

        .img-wrapper {
            position: relative; width: 100%; padding-top: 115%; background: #080808; overflow: hidden;
        }
        .img-wrapper .user-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: grayscale(100%) contrast(1.1);
            z-index: 2; transition: 0.3s;
        }
        .img-wrapper .bg-blur {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover; background-position: center;
            filter: grayscale(100%) blur(8px) brightness(0.3);
            opacity: 0.7; z-index: 1;
        }
        .eye-black-bar {
            position: absolute; top: 36%; left: 5%; width: 90%; height: 18%;
            background: #000000; z-index: 10; border-radius: 4px;
            border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center;
            opacity: 0.9;
        }
        .eye-black-bar::after {
            content: '▇▇ REDACTED ▇▇'; font-size: 8px; letter-spacing: 2px; font-weight: 800;
            color: #444; background: #111; padding: 2px 10px; border-radius: 20px;
        }
        .watermark-lock {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            padding: 4px 12px; border-radius: 40px; color: #f5c518; font-size: 10px; font-weight: 600;
            border: 1px solid #f5c51830; z-index: 20;
        }
        .member-footer {
            padding: 12px 16px; background: #0a0a0a; border-top: 1px solid #181818;
            display: flex; justify-content: space-between; align-items: center;
        }
        .member-footer .name { color: #bbb; font-weight: 600; font-size: 13px; }
        .member-footer .badge { color: #444; font-size: 10px; background: #151515; padding: 2px 10px; border-radius: 40px; border: 1px solid #222; }

        .hero-overlay { 
            margin-top: 20px; 
            padding: 30px 0 10px; 
            text-align: center; 
            border-top: 1px solid #1a1a1a; 
        }
        .hero-overlay h1 {
            font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; text-transform: uppercase; letter-spacing: 10px;
            color: transparent; -webkit-text-stroke: 2px #e50914;
            background: repeating-linear-gradient(45deg, #111, #111 10px, #1a1a1a 10px, #1a1a1a 20px);
            -webkit-background-clip: text; background-clip: text;
            text-shadow: 0 0 50px rgba(229, 9, 20, 0.2);
        }
        /* सारा "FOR PERSONAL USE" और "NOT FOR SHARING" वाला टेक्स्ट हटा दिया */
        .hero-overlay .sub-line {
            color: #333; font-size: 12px; letter-spacing: 3px; margin-top: 10px;
        }

        /* ---------- कस्टम रेड मोडल (Alert Box) ---------- */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }
        .custom-modal.active {
            display: flex;
        }
        .modal-box {
            background: #1a1a1a;
            border: 2px solid #e50914;
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(229, 9, 20, 0.3);
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            font-size: 56px;
            color: #e50914;
            margin-bottom: 15px;
        }
        .modal-text {
            color: #e50914;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 25px;
        }
        .modal-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-btn:hover {
            background: #ff1a2a;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .vault-container { padding: 15px; }
            .paywall-banner { flex-direction: column; align-items: stretch; }
            .pay-btn { justify-content: center; }
            .member-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
            .eye-black-bar { height: 14%; top: 38%; }
            .eye-black-bar::after { font-size: 5px; }
            .modal-text { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="vault-container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo-area">
            <div class="lock-icon"><i class="fas fa-skull"></i></div>
            <div class="logo-text">
                <h1>DOSSIER // 001</h1>
                <span><i class="fas fa-circle" style="color:#e50914; font-size: 8px;"></i> ENCRYPTED • CLASSIFIED</span>
            </div>
        </div>
        <div class="status-badge"><i class="fas fa-circle" style="color:#e50914;"></i> PAYWALL ACTIVE</div>
    </div>

    <!-- PAYWALL BANNER - बिना "add/edit" वाली लाइन के -->
    <div class="paywall-banner" id="paywallBanner">
        <div class="paywall-text">
            <i class="fas fa-file-invoice-dollar"></i>
            <div>
                <h2>🔒 FULL DOSSIER LOCKED</h2>
                <p>Complete photographic profiles locked. Premium access required.</p>
            </div>
        </div>
        <!-- अब यह बटन सीधा UPI खोलेगा, बिना किसी Alert के -->
        <button class="pay-btn" onclick="initiateUPIPayment()">
            <i class="fas fa-unlock-alt"></i> Pay ₹1199 via UPI
        </button>
    </div>

    <!-- MEMBER GRID -->
    <div class="member-grid" id="memberGrid"></div>

    <!-- CENTRAL OVERLAY - सिर्फ "GO TO CRIME MARKET" बचा है, बाकी सब हटा दिया -->
    <div class="hero-overlay">
        <h1>GO TO CRIME MARKET</h1>
        <p class="sub-line">🔍 CLASSIFIED DOSSIER</p>
    </div>

</div>

<!-- ---------- कस्टम रेड मोडल (Alert) ---------- -->
<div class="custom-modal" id="lockedModal">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-text">You can see the all crime after unlocked</div>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<script>
    // ---------- DATA ----------
    const memberData = [
        { name: "Narendra Modi", badge: "PM-IND", defaultPhoto: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Narendra_Modi_2023_%28cropped%29.jpg/400px-Narendra_Modi_2023_%28cropped%29.jpg" },
        { name: "Dr K. LAXMAN", badge: "RS-MP", defaultPhoto: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/K._Laxman.jpg/400px-K._Laxman.jpg" },
        { name: "Lok Sabha MPs (BJP)", badge: "LS-2024", defaultPhoto: "https://i.pravatar.cc/300?img=31" },
        { name: "Rajya Sabha MPs (BJP)", badge: "RS-2024", defaultPhoto: "https://i.pravatar.cc/300?img=32" },
        { name: "State Presidents (BJP)", badge: "ST-PRES", defaultPhoto: "https://i.pravatar.cc/300?img=33" },
        { name: "BJP National Team", badge: "HQ-DEL", defaultPhoto: "https://i.pravatar.cc/300?img=34" },
        { name: "BJP Spokesperson", badge: "MEDIA", defaultPhoto: "https://i.pravatar.cc/300?img=35" },
        { name: "BJP Leader (Gen.)", badge: "KARYAKARTA", defaultPhoto: "https://i.pravatar.cc/300?img=36" }
    ];

    const grid = document.getElementById('memberGrid');

    // ---------- BUILD CARDS ----------
    memberData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'member-card';
        card.setAttribute('data-index', index);
        
        const currentPhoto = item.defaultPhoto;
        
        card.innerHTML = `
            <div class="img-wrapper">
                <div class="bg-blur" style="background-image: url('${currentPhoto}');"></div>
                <div class="user-image" style="background-image: url('${currentPhoto}');"></div>
                <div class="eye-black-bar"></div>
                <div class="watermark-lock"><i class="fas fa-lock"></i> LOCKED</div>
            </div>
            <div class="member-footer">
                <span class="name">${item.name}</span>
                <span class="badge">${item.badge}</span>
            </div>
        `;

        // ---------- CARD TAP: अब सिर्फ रेड मोडल खुलेगा, Gallery नहीं ----------
        card.addEventListener('click', function(e) {
            // Scroll to top smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
            // Show Red Modal with Alert Symbol
            document.getElementById('lockedModal').classList.add('active');
        });

        grid.appendChild(card);
    });

    // ---------- MODAL CLOSE ----------
    function closeModal() {
        document.getElementById('lockedModal').classList.remove('active');
    }
    // अगर Modal के बाहर क्लिक करें तो बंद हो
    document.getElementById('lockedModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // ---------- UPI PAYMENT (₹1199) - बिना किसी Alert के सीधा खुलेगा ----------
    function initiateUPIPayment() {
        const upiId = 'Deewuuu01@ptyes';
        const amount = '1199.00';
        const currency = 'INR';
        const payeeName = 'Dossier Vault';
        const transactionNote = 'Classified Dossier';
        
        const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=${currency}&tn=${encodeURIComponent(transactionNote)}`;
        
        // सीधा UPI ऐप खोलें
        window.location.href = upiUrl;
        
        // अगर UPI ऐप न खुले तो ये फॉलबैक Alert (बिना "Unlock" वाली बकवास के)
        setTimeout(() => {
            alert('📱 अगर UPI ऐप नहीं खुलता, तो मैन्युअल भेजें:\n\nUPI ID: ' + upiId + '\nराशि: ₹' + amount);
        }, 3000);
    }

    console.log('✅ बिल्कुल प्रोफेशनल फाइनल वेबसाइट तैयार है!');
</script>

</body>
</html>
