<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJP Leaders - Photo Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff9933;
            margin-bottom: 20px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .slot {
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .slot img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 5px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Meri Edited Photos (Slot)</h1>
    
    <div class="photo-grid">

        <!-- SLOT 1 -->
        <div class="slot">
            <!-- Yahan Photo 1 ka URL paste karein -->
            <img src="YAHAN_PHOTO_1_KA_URL.jpg" alt="Photo 1" onerror="this.src='https://via.placeholder.com/300x200?text=Photo+1+URL+Daalo'">
        </div>

        <!-- SLOT 2 -->
        <div class="slot">
            <!-- Yahan Photo 2 ka URL paste karein -->

        <!-- SLOT 5 -->

</html>
