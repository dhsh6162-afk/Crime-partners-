<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Master Update</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #ff9933; }
        
        /* UPI Section Styling */
        .upi-section { background: #fff; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 10px; border: 2px solid #ff9933; }
        .upi-section img { max-width: 200px; margin-bottom: 10px; }
        .upi-id { font-size: 18px; font-weight: bold; color: #333; background: #eee; padding: 10px; border-radius: 5px; }

        /* Photo Section Styling */
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-width: 1200px; margin: 20px auto; }
        .slot { background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .slot img { width: 100%; height: auto; display: block; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Meri Updated Website</h1>

    <!-- ============================================ -->
    <!-- UPAR 1. UPI SYSTEM KA SECTION (Apna Detail daalein) -->
    <!-- ============================================ -->
    <div class="upi-section">
        <h2>Support / Donate (UPI)</h2>
        <!-- Yahan Apna QR Code ka Image Link daalein -->
        <img src="YAHAN_APNA_QR_CODE_KA_LINK.jpg" alt="QR Code">
        
        <p>UPI ID:</p>
        <!-- Yahan Apna UPI ID likhein -->
        <div class="upi-id">yourname@upi</div>
    </div>

    <!-- ============================================ -->
    <!-- NEECHE 2. 8 PHOTOS KE SLOTS (Apni Photos ke links daalein) -->
    <!-- ============================================ -->
    <div class="photo-grid">

        <!-- Slot 1 -->
        <div class="slot"><img src="YAHAN_PHOTO_1_KA_LINK.jpg" alt="Photo 1"></div>
        
        <!-- Slot 2 -->
        <div class="slot"><img src="YAHAN_PHOTO_2_KA_LINK.jpg" alt="Photo 2"></div>
        
        <!-- Slot 3 -->
        <div class="slot"><img src="YAHAN_PHOTO_3_KA_LINK.jpg" alt="Photo 3"></div>
        
        <!-- Slot 4 -->
        <div class="slot"><img src="YAHAN_PHOTO_4_KA_LINK.jpg" alt="Photo 4"></div>
        
        <!-- Slot 5 -->
        <div class="slot"><img src="YAHAN_PHOTO_5_KA_LINK.jpg" alt="Photo 5"></div>
        
        <!-- Slot 6 -->
        <div class="slot"><img src="YAHAN_PHOTO_6_KA_LINK.jpg" alt="Photo 6"></div>
        
        <!-- Slot 7 -->
        <div class="slot"><img src="YAHAN_PHOTO_7_KA_LINK.jpg" alt="Photo 7"></div>
        
        <!-- Slot 8 -->
        <div class="slot"><img src="YAHAN_PHOTO_8_KA_LINK.jpg" alt="Photo 8"></div>

    </div>

</body>
</html>
